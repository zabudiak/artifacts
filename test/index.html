<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Test artifact</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f1115;color:#e8e8e8;display:grid;place-items:center;min-height:100vh}
.card{background:#181b22;border:1px solid #2a2f3a;border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center}
h1{margin:0 0 8px;font-size:28px}p{color:#9aa3b2;line-height:1.5}
button{margin-top:20px;background:#c08552;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;cursor:pointer}
#n{font-size:48px;font-weight:700;margin-top:16px}
</style></head>
<body><div class="card">
<h1>Test artifact</h1>
<p>Built by Mocha for Zaid. If you can see this, the shareable link works.</p>
<div id="n">0</div>
<button onclick="document.getElementById('n').textContent=++c">Click me</button>
<p style="font-size:13px;margin-top:24px">Published <span id="d"></span></p>
</div>
<script>let c=0;document.getElementById('d').textContent=new Date(document.lastModified).toLocaleString()</script>
</body></html>
